<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bodyFur" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FCE1B6"/>
      <stop offset="60%" stop-color="#F4A460"/>
      <stop offset="100%" stop-color="#C87030"/>
    </radialGradient>
    <radialGradient id="bellyFur" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FDF5E8"/>
      <stop offset="100%" stop-color="#EBD9BE"/>
    </radialGradient>
    <radialGradient id="innerEar" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FCA59D"/>
      <stop offset="100%" stop-color="#E57C6B"/>
    </radialGradient>
    <radialGradient id="glassyEye" cx="35%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#4A2E18"/>
      <stop offset="70%" stop-color="#140D07"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes earFlickL {
      0%, 90%, 100% { transform: rotate(0deg); }
      93% { transform: rotate(-12deg); }
      96% { transform: rotate(4deg); }
    }
    @keyframes earFlickR {
      0%, 88%, 100% { transform: rotate(0deg); }
      91% { transform: rotate(12deg); }
      94% { transform: rotate(-4deg); }
    }
    @keyframes eyeBlink {
      0%, 92%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.08); }
    }
    @keyframes noseSniff {
      0%, 85%, 100% { transform: scale(1); }
      88% { transform: scale(1.15, 0.9); }
      92% { transform: scale(0.95, 1.08); }
    }
    @keyframes whiskerTwitch {
      0%, 85%, 100% { transform: rotate(0deg); }
      87% { transform: rotate(-3deg); }
      90% { transform: rotate(3deg); }
    }
    
    .ear-left { transform-origin: 26px 36px; animation: earFlickL 5s infinite ease-in-out; }
    .ear-right { transform-origin: 94px 36px; animation: earFlickR 5.5s infinite ease-in-out; }
    .eye-group { transform-origin: 60px 58px; animation: eyeBlink 4s infinite ease-in-out; }
    .nose-group { transform-origin: 60px 65px; animation: noseSniff 3.2s infinite ease-in-out; }
    .whiskers { transform-origin: 60px 65px; animation: whiskerTwitch 3.2s infinite ease-in-out; }
  </style>

  <!-- Left Ear -->
  <g className="ear-left">
    <ellipse cx="26" cy="32" rx="14" ry="17" fill="url(#bodyFur)"/>
    <ellipse cx="26" cy="33" rx="8" ry="11" fill="url(#innerEar)"/>
  </g>

  <!-- Right Ear -->
  <g className="ear-right">
    <ellipse cx="94" cy="32" rx="14" ry="17" fill="url(#bodyFur)"/>
    <ellipse cx="94" cy="33" rx="8" ry="11" fill="url(#innerEar)"/>
  </g>

  <!-- Main Head Canvas -->
  <ellipse cx="60" cy="62" rx="42" ry="38" fill="url(#bodyFur)"/>
  
  <!-- Cream Muzzle & Chest -->
  <ellipse cx="60" cy="74" rx="26" ry="20" fill="url(#bellyFur)"/>
  <ellipse cx="48" cy="68" rx="13" ry="11" fill="url(#bellyFur)"/>
  <ellipse cx="72" cy="68" rx="13" ry="11" fill="url(#bellyFur)"/>

  <!-- Blushing Cheeks -->
  <ellipse cx="32" cy="66" rx="9" ry="6" fill="#FF826E" opacity="0.35"/>
  <ellipse cx="88" cy="66" rx="9" ry="6" fill="#FF826E" opacity="0.35"/>

  <!-- Glassy Blinking Eyes -->
  <g className="eye-group">
    <!-- Left Eye -->
    <ellipse cx="40" cy="54" rx="8" ry="9" fill="url(#glassyEye)"/>
    <circle cx="37" cy="51" r="2.8" fill="#FFFFFF"/>
    <circle cx="42" cy="56" r="1.3" fill="#FFFFFF" opacity="0.7"/>

    <!-- Right Eye -->
    <ellipse cx="80" cy="54" rx="8" ry="9" fill="url(#glassyEye)"/>
    <circle cx="77" cy="51" r="2.8" fill="#FFFFFF"/>
    <circle cx="82" cy="56" r="1.3" fill="#FFFFFF" opacity="0.7"/>
  </g>

  <!-- Sniffing Heart Nose & Mouth -->
  <g className="nose-group">
    <path d="M55 64 Q60 61 65 64 Q66 68 60 71 Q54 68 55 64 Z" fill="#E57C6B"/>
    <circle cx="60" cy="64" r="1.5" fill="#FFFFFF" opacity="0.6"/>
    <path d="M60 71 L60 74 M55 76 Q60 78 60 74 Q60 78 65 76" stroke="#B05C4D" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Twitching Whiskers -->
  <g className="whiskers" stroke="#EBD9BE" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
    <line x1="38" y1="66" x2="16" y2="62"/>
    <line x1="37" y1="69" x2="14" y2="70"/>
    <line x1="39" y1="72" x2="18" y2="78"/>
    <line x1="82" y1="66" x2="104" y2="62"/>
    <line x1="83" y1="69" x2="106" y2="70"/>
    <line x1="81" y1="72" x2="102" y2="78"/>
  </g>
</svg>
